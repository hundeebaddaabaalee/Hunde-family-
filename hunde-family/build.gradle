plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.hunde.family'
    compileSdk 34

    defaultConfig {
        applicationId "com.hunde.family"
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        // Desugaring isaan Java 8+ deeggaruuf
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Call System fi UI akka nagaatti hojjetaniif
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core library desugaring dependency
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // AndroidX & Core UI
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Firebase (Auth, Realtime Database & Messaging waamicha bilbilaaf)
    implementation 'com.google.firebase:firebase-auth:22.3.1'
    implementation 'com.google.firebase:firebase-database:20.3.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1' // Waamicha (Call Notification) ittiin erguuf

    // --- AGORA SDK (Voice & Video Call System) ---
    implementation 'io.agora.rtc:full-sdk:4.3.0'

    // Circle ImageView (Profile Suuraa Geengoo gochuuf Salphaatti)
    implementation 'de.hdodenhof:circleimageview:3.1.0'
}